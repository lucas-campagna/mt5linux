name: Build MT5 Server Binary

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller rpyc numpy plumbum pyparsing

      - name: Build with PyInstaller
        run: |
          pyinstaller --name mt5server --onefile mt5linux/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt5server
          path: dist/mt5server.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mt5server
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/mt5server.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
