name: Test E2E

on:
  pull_request:
    paths:
      - 'mt5linux/**'
      - 'tests/e2e/**'
      - '.github/workflows/test-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: lprett/mt5linux:latest
      env:
        MT5_LOGIN: ${{ secrets.MT5_E2E_LOGIN }}
        MT5_PASSWORD: ${{ secrets.MT5_E2E_PASSWORD }}
        MT5_SERVER: ${{ secrets.MT5_E2E_SERVER }}
      ports:
        - "18812:18812"
    steps:
      - name: Wait for MT5 RPyC server to be ready
        run: |
          echo "Waiting for MT5 RPyC server on port 18812..."
          timeout=180
          while ! nc -z localhost 18812 && [ $timeout -gt 0 ]; do
            sleep 1
            timeout=$((timeout-1))
          done
          if [ $timeout -eq 0 ]; then
            echo "MT5 RPyC server not ready after 180s"
            exit 1
          fi
          echo "MT5 RPyC server is up on port 18812"
          echo "Waiting additional time for MT5 terminal to fully initialize..."
          sleep 30

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run E2E tests
        env:
          MT5_E2E_MODE: remote
          MT5_E2E_HOST: localhost
          MT5_E2E_PORT: 18812
          LOGIN: ${{ secrets.MT5_E2E_LOGIN }}
          PASSWORD: ${{ secrets.MT5_E2E_PASSWORD }}
          SERVER: ${{ secrets.MT5_E2E_SERVER }}
        run: pytest tests/e2e/ -m "not trading" -v
