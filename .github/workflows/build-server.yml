name: Build MT5 Server

on:
  workflow_dispatch:
    inputs:
      create-release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'
        type: boolean
  push:
    tags:
      - 'server-*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Visual C++ Redistributable
        run: |
          curl -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          ./vc_redist.x64.exe /install /quiet /norestart

      - name: Install dependencies
        run: |
          pip install pyinstaller 'rpyc>=6.0.0,<7' numpy plumbum pyparsing MetaTrader5

      - name: Build with PyInstaller
        run: |
          pyinstaller --name mt5server --onefile --additional-hooks-dir=. --hidden-import=MetaTrader5 mt5linux/__main__.py


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt5server
          path: dist/mt5server.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/server-') || github.event.inputs.create-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mt5server
          path: dist

      - name: Create tag if needed
        if: github.event.inputs.create-release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version=$(date +%Y.%m.%d.%H%M%S)
          git tag "server-$version"
          git push origin tag "server-$version"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/mt5server.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
