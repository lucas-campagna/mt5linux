name: Test

on:
  pull_request:
    paths:
      - 'mt5linux/**'
      - 'tests/**'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check mt5linux/

      - name: Run tests
        run: pytest tests/ --ignore=tests/integration/ -m "not e2e and not trading" -v
