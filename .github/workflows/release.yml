name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        run: |
          version=$(grep -oP 'version = "\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          echo "CURRENT_VERSION=$version" >> $GITHUB_ENV

      - name: Determine bump type - workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "BUMP_TYPE=${{ inputs.bump }}" >> $GITHUB_ENV

      - name: Determine bump type - major
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'major')
        run: echo "BUMP_TYPE=major" >> $GITHUB_ENV

      - name: Determine bump type - minor
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'minor')
        run: echo "BUMP_TYPE=minor" >> $GITHUB_ENV

      - name: Determine bump type - patch
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'patch')
        run: echo "BUMP_TYPE=patch" >> $GITHUB_ENV

      - name: Check for update-docker-image label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'update-docker-image')
        run: echo "NEEDS_DOCKER_TAG=true" >> $GITHUB_ENV

      - name: Check for update-server label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'update-server')
        run: echo "NEEDS_SERVER_TAG=true" >> $GITHUB_ENV

      - name: Fail if no bump type
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'major') == false && contains(github.event.pull_request.labels.*.name, 'minor') == false && contains(github.event.pull_request.labels.*.name, 'patch') == false)
        run: |
          echo "No release label found. Expected: major, minor, or patch"
          exit 1

      - name: Bump version
        run: |
          case "${{ env.BUMP_TYPE }}" in
            major)
              new_version=$(echo ${{ env.CURRENT_VERSION }} | awk -F. '{print $1+1 ".0.0"}')
              ;;
            minor)
              new_version=$(echo ${{ env.CURRENT_VERSION }} | awk -F. '{print $1 "." $2+1 ".0"}')
              ;;
            patch)
              new_version=$(echo ${{ env.CURRENT_VERSION }} | awk -F. '{print $1 "." $2 "." $3+1}')
              ;;
          esac
          echo "New version: $new_version"
          sed -i "s/version = \"${{ env.CURRENT_VERSION }}\"/version = \"$new_version\"/" pyproject.toml

      - name: Get new version
        run: |
          version=$(grep -oP 'version = "\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          echo "NEW_VERSION=$version" >> $GITHUB_ENV

      - name: Create commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release v${{ env.NEW_VERSION }}"

      - name: Create tags
        run: |
          git tag ${{ env.NEW_VERSION }}
          if [ "${{ env.NEEDS_DOCKER_TAG }}" == "true" ]; then
            git tag docker-${{ env.NEW_VERSION }}
          fi
          if [ "${{ env.NEEDS_SERVER_TAG }}" == "true" ]; then
            git tag server-${{ env.NEW_VERSION }}
          fi

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push --tags origin ${{ github.ref }}

      - name: Trigger PyPI publish
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml

      - name: Trigger Docker publish
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels='${{ toJson(github.event.pull_request.labels) }}'
          if echo "$labels" | grep -q '"name":"update-docker-image"'; then
            gh workflow run publish-docker.yml --field version=${{ env.NEW_VERSION }}
          fi

      - name: Trigger Server build
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels='${{ toJson(github.event.pull_request.labels) }}'
          if echo "$labels" | grep -q '"name":"update-server"'; then
            gh workflow run build-server.yml --field create-release=true
          fi
