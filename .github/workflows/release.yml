name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        run: |
          version=$(grep -oP 'version = "\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          echo "CURRENT_VERSION=$version" >> $GITHUB_ENV

      - name: Determine bump type
        id: bump
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "BUMP_TYPE=${{ inputs.bump }}" >> $GITHUB_ENV
          else
            labels='${{ toJson(github.event.pull_request.labels) }}'
            if echo "$labels" | grep -q '"name":"major"'; then
              echo "BUMP_TYPE=major" >> $GITHUB_ENV
            elif echo "$labels" | grep -q '"name":"minor"'; then
              echo "BUMP_TYPE=minor" >> $GITHUB_ENV
            elif echo "$labels" | grep -q '"name":"patch"'; then
              echo "BUMP_TYPE=patch" >> $GITHUB_ENV
            else
              echo "No release label found. Expected: major, minor, or patch"
              exit 1
            fi
          fi

      - name: Check for update-docker-image label
        id: check-docker-label
        if: github.event_name == 'pull_request'
        run: |
          labels='${{ toJson(github.event.pull_request.labels) }}'
          if echo "$labels" | grep -q '"name":"update-docker-image"'; then
            echo "NEEDS_DOCKER_TAG=true" >> $GITHUB_ENV
          fi

      - name: Check for update-server label
        id: check-server-label
        if: github.event_name == 'pull_request'
        run: |
          labels='${{ toJson(github.event.pull_request.labels) }}'
          if echo "$labels" | grep -q '"name":"update-server"'; then
            echo "NEEDS_SERVER_TAG=true" >> $GITHUB_ENV
          fi

      - name: Bump version
        run: |
          case "${{ env.BUMP_TYPE }}" in
            major)
              new_version=$(echo ${{ env.CURRENT_VERSION }} | awk -F. '{print $1+1 ".0.0"}')
              ;;
            minor)
              new_version=$(echo ${{ env.CURRENT_VERSION }} | awk -F. '{print $1 "." $2+1 ".0"}')
              ;;
            patch)
              new_version=$(echo ${{ env.CURRENT_VERSION }} | awk -F. '{print $1 "." $2 "." $3+1}')
              ;;
          esac
          echo "New version: $new_version"
          sed -i "s/version = \"${{ env.CURRENT_VERSION }}\"/version = \"$new_version\"/" pyproject.toml

      - name: Get new version
        run: |
          version=$(grep -oP 'version = "\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          echo "NEW_VERSION=$version" >> $GITHUB_ENV

      - name: Create commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release v${{ env.NEW_VERSION }}"

      - name: Create tags
        run: |
          git tag ${{ env.NEW_VERSION }}
          if [ "${{ env.NEEDS_DOCKER_TAG }}" == "true" ]; then
            git tag docker-${{ env.NEW_VERSION }}
          fi
          if [ "${{ env.NEEDS_SERVER_TAG }}" == "true" ]; then
            git tag server-${{ env.NEW_VERSION }}
          fi

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push --tags origin ${{ github.ref }}
