services:
  mt5linux:
    image: lprett/mt5linux:latest
    container_name: mt5linux
    restart: unless-stopped
    environment:
        MT5_SERVER: ${SERVER}
        MT5_LOGIN: ${LOGIN}
        MT5_PASSWORD: ${PASSWORD}
    ports:
      - 8080:8080   # noVNC page port
      - 5901:5901   # noVNC port
      - 18812:18812 # mt5linux page port
