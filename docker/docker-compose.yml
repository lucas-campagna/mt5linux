services:
  mt5linux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5-headless
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /tmp/mt5:/app
    environment:
      - LOGIN=${MT5_LOGIN:-}
      - PASSWORD=${MT5_PASSWORD:-}
      - SERVER=${MT5_SERVER:-}
