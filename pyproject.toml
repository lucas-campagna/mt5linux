[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5linux"
version = "1.1.1"
description = "MetaTrader5 for linux users"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lucas Prett Campagna"}]
dependencies = [
    "numpy",
    "plumbum==1.7.0",
    "pyparsing>=3.1.0,<4",
    "python-dotenv",
    "rpyc>=6.0.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mt5linux*"]

[project.urls]
Homepage = "https://github.com/lucas-campagna/mt5linux"

[project.optional-dependencies]
dev = ["build", "twine", "pytest", "ruff"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that need a live MetaTrader 5 server (see tests/e2e)",
    "trading: e2e tests that place real orders (opt-in via MT5_E2E_ALLOW_ORDER_SEND=1)",
]

[tool.ruff.lint.per-file-ignores]
# Best-effort cleanup in e2e teardowns must not mask test results.
"tests/e2e/*" = ["S110", "BLE001"]
# Legacy code: PEP 484 implicit Optional (param default None)
# Legacy code: bare except, try-except-continue, blind exception
# Legacy code: nested if statements, unsorted imports
"mt5linux/**/*.py" = ["RUF013", "E722", "S112", "BLE001", "SIM102", "I001"]
# Legacy code: subprocess.run without explicit check
"mt5linux/_docker_runtime.py" = ["PLW1510"]
"mt5linux/_udocker_runtime.py" = ["PLW1510"]
# Legacy code: root logger usage
"mt5linux/ui.py" = ["LOG015"]
