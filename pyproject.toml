[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5linux"
version = "1.1.0"
description = "MetaTrader5 for linux users"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lucas Prett Campagna"}]
dependencies = [
    "numpy",
    "plumbum==1.7.0",
    "pyparsing>=3.1.0,<4",
    "python-dotenv",
    "rpyc>=6.0.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mt5linux*"]

[project.urls]
Homepage = "https://github.com/lucas-campagna/mt5linux"

[project.optional-dependencies]
dev = ["build", "twine"]
