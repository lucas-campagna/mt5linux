[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5linux"
version = "1.1.1"
description = "MetaTrader5 for linux users"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lucas Prett Campagna"}]
dependencies = [
    "numpy",
    "plumbum==1.7.0",
    "pyparsing>=3.1.0,<4",
    "python-dotenv",
    "rpyc>=6.0.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mt5linux*"]

[project.urls]
Homepage = "https://github.com/lucas-campagna/mt5linux"

[project.optional-dependencies]
dev = ["build", "twine", "pytest", "ruff"]
# gRPC transport (client + in-container bridge). Additive to the RPyC runtime:
# nothing here is imported unless mt5linux.grpc or mt5linux.bridge is used.
grpc = [
    "aiosqlite>=0.19.0",
    "grpcio>=1.60.0",
    "numpy>=2.1,<3",
    "orjson>=3.11.6",
    "protobuf>=6.33.5,<7",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.15.0",
    "structlog>=25.5.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that need a live MetaTrader 5 server (see tests/e2e)",
    "trading: e2e tests that place real orders (opt-in via MT5_E2E_ALLOW_ORDER_SEND=1)",
]

[tool.ruff.lint.per-file-ignores]
# Best-effort cleanup in e2e teardowns must not mask test results.
"tests/e2e/*" = ["S110", "BLE001"]
